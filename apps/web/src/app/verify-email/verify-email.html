<div class="auth-page">
  <div class="auth-card">

    @switch (state()) {
      @case ('verifying') {
        <div class="loading-state" role="status" aria-live="polite">
          <div class="spinner large"></div>
          <h1 class="auth-title">Verifying your email…</h1>
          <p class="auth-lead">One moment while we activate your account.</p>
        </div>
      }
      @case ('success') {
        <div class="auth-alert auth-alert--success" role="status" aria-live="polite">
          <span class="material-icons auth-alert__icon" aria-hidden="true">check_circle</span>
          <h1 class="auth-title">Email verified</h1>
          <p>{{ message() }}</p>
        </div>
        <a routerLink="/login" class="btn btn--primary btn--block">Continue to login</a>
      }
      @case ('error') {
        <div class="auth-alert auth-alert--danger" role="alert">
          <span class="material-icons auth-alert__icon" aria-hidden="true">error_outline</span>
          <h1 class="auth-title">Activation problem</h1>
          <p>{{ message() }}</p>
        </div>
        <a routerLink="/login" class="btn btn--primary btn--block">Go to login</a>
        <div class="auth-links">
          <a routerLink="/register-user">Register again</a>
        </div>
      }
    }

  </div>
</div>
