# HTTP security headers for everything nginx serves itself (the SPA shell,
# hashed assets, manuals). NOT included in `location /api/` - the API sets its
# own headers (helmet) and they pass through the proxy untouched.
#
# nginx gotcha: `add_header` in a location REPLACES every add_header inherited
# from the server block, so this file is included in EACH location that sets
# its own Cache-Control, rather than once at server level.
#
# CSP notes (verified in the browser on dev, 2026-10-30):
# - script-src: the SPA bundle + Google Identity Services. No inline scripts:
#   the pre-paint theme script lives in /theme-boot.js so no hash is needed.
# - style-src 'unsafe-inline': Angular injects component styles as <style>
#   elements at runtime and the production build inlines critical CSS.
# - img-src https:: company logos / photos / icons are public objects on
#   storage.googleapis.com, avatars come from Google / Microsoft, and email
#   previews (srcdoc iframes inherit this policy) may reference any host.
# - connect-src / frame-src: Google Identity Services and Microsoft Entra
#   (MSAL silent renewals run in a hidden iframe to login.microsoftonline.com).
# - frame-ancestors 'none' + X-Frame-Options DENY: the app is never embedded.
# - COOP same-origin-allow-popups: required by both sign-in SDKs.
# - Permissions-Policy camera=(self): the QR scanner uses the camera.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com/gsi/ https://login.microsoftonline.com; frame-src https://accounts.google.com https://login.microsoftonline.com; worker-src 'self' blob:; manifest-src 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
