# Angular SPA served by nginx on Cloud Run.
# ${PORT} is expanded at container startup by the nginx image's envsubst step
# (Cloud Run sets PORT; default 8080). Only env vars that actually exist are
# substituted, so nginx variables like $uri / $host are left untouched.
server {
    listen       ${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress text assets on the fly.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Content-hashed build assets can be cached aggressively.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html, so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # In-app user guides (/help/index.json + the .md manuals). These are edited
    # between deploys and the MANIFEST is what decides whether a screen shows
    # its Book icon, so they must never be served from a stale cache. Neither
    # .json nor .md matches the hashed-asset regex above, so without this block
    # they fall through to `location /` with NO Cache-Control at all - and a
    # browser then applies heuristic caching, which is exactly how a freshly
    # published manual stayed invisible to anyone who had used the app before.
    # `no-cache` forces revalidation, not a re-download: the ETag still answers
    # 304 when nothing changed.
    location /help/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API reverse proxy: keeps the app same-origin with the API where no load
    # balancer sits in front (dev/staging). ${API_HOST} is expanded at container
    # startup and is REQUIRED - it has no default, and 05-require-api-host.sh
    # aborts startup when it is missing rather than let a wrong host through.
    # Behind an HTTPS LB that routes /api/* to the API itself, this location is
    # dormant, but the value must still be set for the config to render.
    location /api/ {
        proxy_pass https://${API_HOST};
        proxy_set_header Host ${API_HOST};
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        client_max_body_size 10m;
    }

    # SPA fallback: unknown paths serve index.html so Angular client-side routing
    # (e.g. /admin/roles, /golf) works on refresh and deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
